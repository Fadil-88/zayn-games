<style>
/* Layout: one full-screen sky. The game is drawn on a canvas; big round buttons sit on top. Single bright daytime look for a 3-year-old. */
:root{
  --sky-top:#6cc1ff; --sky-bottom:#d9f1ff; --ink:#2b2257; --btn:#ff5fa2; --btn2:#ffc93a; --white:#ffffff;
  --round:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--sky-bottom);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--round);color:var(--ink)}
[hidden]{display:none!important}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.big{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:50%;width:min(46vmin,260px);height:min(46vmin,260px);
  background:radial-gradient(circle at 35% 30%,#ffd1e6 0,var(--btn) 45%,#e0367f 100%);color:#fff;font-size:min(20vmin,110px);line-height:1;cursor:pointer;
  box-shadow:0 12px 0 rgba(0,0,0,.12),0 18px 40px rgba(224,54,127,.35);display:flex;align-items:center;justify-content:center;font-family:var(--round)}
.big:active{transform:translate(-50%,-50%) scale(.95)}
.big:focus-visible{outline:6px solid #fff;outline-offset:6px}
.big.again{background:radial-gradient(circle at 35% 30%,#fff3c2 0,var(--btn2) 45%,#e0a100 100%);box-shadow:0 12px 0 rgba(0,0,0,.12),0 18px 40px rgba(224,161,0,.35)}
.title{position:fixed;left:0;right:0;top:calc(4vh + env(safe-area-inset-top,0px));text-align:center;font-weight:800;font-size:clamp(34px,9vmin,72px);
  color:#fff;text-shadow:0 4px 0 #ff5fa2,0 8px 18px rgba(43,34,87,.25);pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.corner{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.75);
  font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08);text-decoration:none;color:var(--ink)}
.corner:focus-visible{outline:4px solid #fff}
#home{left:max(12px,env(safe-area-inset-left,0px))}
#sound{right:max(12px,env(safe-area-inset-right,0px))}
#nojs{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:600 20px/1.4 system-ui,sans-serif;background:var(--sky-bottom)}
</style>

<body>
<div id="nojs">If this message stays, open Balloon Pop from its web link in Safari or Chrome.</div>
<canvas id="sky" aria-label="Balloon Pop game: tap the balloons"></canvas>
<div class="title" id="title">Balloon Pop!</div>
<button class="big" id="start" aria-label="Play">▶</button>
<button class="big again" id="again" aria-label="Play again" hidden>🔁</button>
<a class="corner" id="home" href="../" aria-label="Back to Zayn's Arcade">🏠</a>
<button class="corner" id="sound" aria-label="Sound on or off">🔊</button>

<script>
(function(){
try{ document.getElementById("nojs").remove(); }catch(e){}
const cv=document.getElementById("sky"), ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1;
function fit(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const vv=window.visualViewport; W=vv?vv.width:innerWidth; H=vv?vv.height:innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",fit); if(window.visualViewport) visualViewport.addEventListener("resize",fit); fit();
addEventListener("gesturestart",e=>e.preventDefault());
addEventListener("contextmenu",e=>e.preventDefault());

// ---------- Pictures inside the balloons (with names said out loud) ----------
const ANIMALS=[["🐶","Puppy"],["🐱","Kitty"],["🐰","Bunny"],["🐻","Bear"],["🐼","Panda"],["🐥","Chick"],["🐸","Froggy"],["🦁","Lion"],["🐷","Piggy"],["🐮","Cow"],["🐵","Monkey"],["🦄","Unicorn"]];
const FRUITS=[["🍓","Strawberry"],["🍌","Banana"],["🍎","Apple"],["🍉","Watermelon"],["🍒","Cherries"]];
const SPARKLE=[["⭐","Star"],["🌈","Rainbow"],["🌸","Flower"],["🦋","Butterfly"]];
const COLORS=["#ff5fa2","#ff8a3d","#ffd23a","#4fd17a","#3fb6ff","#a77bff","#ff6b6b","#36d6c3"];
const LEVELS=[
  {need:10, speed:38, rMin:.115, rMax:.14, maxOn:4, every:1.5, pics:ANIMALS},
  {need:15, speed:52, rMin:.10,  rMax:.125,maxOn:6, every:1.1, pics:[...ANIMALS,...FRUITS]},
  {need:20, speed:66, rMin:.09,  rMax:.115,maxOn:8, every:.85, pics:[...ANIMALS,...FRUITS,...SPARKLE]},
];

// ---------- Sound: pops, cheers, and spoken names ----------
let ac=null, soundOn=true;
try{ soundOn=localStorage.getItem("balloon-sound")!=="off"; }catch(e){}
function updSound(){ $("sound").textContent=soundOn?"🔊":"🔇"; }
updSound();
function audio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){} return ac; }
function pop(){
  if(!soundOn||!audio()) return;
  const t=ac.currentTime, g=ac.createGain(); g.connect(ac.destination);
  const len=.12, buf=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const n=ac.createBufferSource(); n.buffer=buf; const f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800;
  n.connect(f); f.connect(g); g.gain.setValueAtTime(.7,t); n.start(t);
  const o=ac.createOscillator(), g2=ac.createGain(); o.connect(g2); g2.connect(ac.destination);
  o.type="sine"; o.frequency.setValueAtTime(700+Math.random()*300,t); o.frequency.exponentialRampToValueAtTime(1500,t+.08);
  g2.gain.setValueAtTime(.12,t); g2.gain.exponentialRampToValueAtTime(.001,t+.12); o.start(t); o.stop(t+.13);
}
function tune(notes,step=.13){
  if(!soundOn||!audio()) return;
  const t=ac.currentTime;
  notes.forEach((f,i)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type="triangle"; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.0001,t+i*step); g.gain.exponentialRampToValueAtTime(.18,t+i*step+.02); g.gain.exponentialRampToValueAtTime(.0001,t+i*step+step*1.6);
    o.start(t+i*step); o.stop(t+i*step+step*1.7); });
}
let lastSpeak=0;
function say(word){
  if(!soundOn) return;
  try{ const now=performance.now(); if(now-lastSpeak<450) return; lastSpeak=now;
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(word); u.rate=.95; u.pitch=1.35; speechSynthesis.speak(u); }catch(e){}
}

// ---------- Counter (only on the website) ----------
function track(name){ try{ if(window.goatcounter&&window.goatcounter.count) window.goatcounter.count({path:name,title:name,event:true}); }catch(e){} }

// ---------- Game state ----------
const G={mode:"title",level:0,popped:0,spawnT:0,t:0,cheer:0};
let balloons=[], bits=[], floaters=[], trophies=[];
const clouds=[]; for(let i=0;i<6;i++) clouds.push({x:Math.random(),y:.08+Math.random()*.35,s:.6+Math.random()*.7,v:.004+Math.random()*.006});
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];

function newBalloon(){
  const L=LEVELS[G.level], m=Math.min(W,H), r=m*rand(L.rMin,L.rMax);
  const [pic,name]=pick(L.pics);
  balloons.push({x:rand(r+10,W-r-10),y:H+r*1.6,r,color:pick(COLORS),pic,name,
    vy:L.speed*rand(.85,1.2)*(m/700+.4),sway:rand(.6,1.2),phase:Math.random()*6,wob:Math.random()*6});
}
function startLevel(i){
  G.level=i; G.popped=0; G.spawnT=0; G.mode="play"; balloons=[]; trophies=[];
  $("start").hidden=true; $("again").hidden=true; $("title").hidden=true;
  for(let k=0;k<2;k++) newBalloon();
  track("balloon-level-"+(i+1)); tune([523,659,784]);
}
function levelDone(){
  G.mode="cheer"; G.cheer=0; confetti(120);
  tune([523,659,784,1047,784,1047],.14); say(G.level===2?"Hooray! You did it!":"Yay! Great popping!");
  if(G.level===2) track("balloon-finished");
}
function confetti(n){
  for(let i=0;i<n;i++) bits.push({x:rand(0,W),y:rand(-H*.3,0),vx:rand(-40,40),vy:rand(60,200),life:rand(2.5,4),c:pick(COLORS),s:rand(5,10),rot:rand(0,6),vr:rand(-6,6)});
}
function burst(b){
  for(let i=0;i<22;i++){ const a=Math.random()*Math.PI*2, s=rand(80,260);
    bits.push({x:b.x+Math.cos(a)*b.r*.6,y:b.y+Math.sin(a)*b.r*.6,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rand(.5,.9),c:b.color,s:rand(5,9),rot:rand(0,6),vr:rand(-8,8)}); }
  floaters.push({x:b.x,y:b.y,pic:b.pic,size:b.r*1.1,life:1.2});
}

// ---------- Tapping / clicking ----------
function hit(px,py){
  if(G.mode!=="play") return;
  audio();
  // most forgiving: pick the closest balloon whose (enlarged) circle contains the tap
  let best=null, bd=1e9;
  for(const b of balloons){ const d=Math.hypot(px-b.x,py-b.y); if(d<b.r*1.25&&d<bd){bd=d;best=b;} }
  if(!best) return;
  balloons.splice(balloons.indexOf(best),1);
  burst(best); pop(); say(best.name);
  G.popped++; trophies.push(best.pic);
  if(G.popped>=LEVELS[G.level].need) levelDone();
}
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); hit(e.clientX,e.clientY); });

$("start").addEventListener("click",()=>{ audio(); say("Pop the balloons!"); track("balloon-started"); startLevel(0); });
$("again").addEventListener("click",()=>{ audio(); track("balloon-started"); startLevel(0); });
$("sound").addEventListener("click",()=>{ soundOn=!soundOn; updSound(); try{ localStorage.setItem("balloon-sound",soundOn?"on":"off"); }catch(e){} if(!soundOn){ try{speechSynthesis.cancel();}catch(e){} } });

// ---------- Update ----------
function update(dt){
  G.t+=dt;
  for(const c of clouds){ c.x+=c.v*dt; if(c.x>1.3) c.x=-.3; }
  if(G.mode==="play"){
    const L=LEVELS[G.level];
    G.spawnT-=dt;
    if(G.spawnT<=0&&balloons.length<L.maxOn){ newBalloon(); G.spawnT=L.every*rand(.7,1.3); }
  }
  for(let i=balloons.length-1;i>=0;i--){
    const b=balloons[i]; b.y-=b.vy*dt; b.phase+=dt*b.sway; b.x+=Math.sin(b.phase)*18*dt;
    b.x=Math.max(b.r,Math.min(W-b.r,b.x));
    if(b.y<-b.r*2.4) balloons.splice(i,1); // floated away: no penalty, a new one comes
  }
  for(let i=bits.length-1;i>=0;i--){ const p=bits[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt; p.rot+=p.vr*dt; p.life-=dt; if(p.life<=0||p.y>H+40) bits.splice(i,1); }
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.y-=70*dt; f.life-=dt; if(f.life<=0) floaters.splice(i,1); }
  if(G.mode==="cheer"){
    G.cheer+=dt;
    if(G.cheer>3.6){
      if(G.level<2) startLevel(G.level+1);
      else { G.mode="end"; balloons=[]; $("again").hidden=false; $("title").textContent="You did it! 🏆"; $("title").hidden=false; }
    }
  }
}

// ---------- Draw ----------
function drawBalloon(b){
  const {x,y,r}=b, wob=Math.sin(G.t*2+b.wob)*.03;
  // string
  ctx.strokeStyle="rgba(43,34,87,.45)"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y+r*1.12);
  for(let k=1;k<=6;k++) ctx.lineTo(x+Math.sin(G.t*3+b.phase+k)*6,y+r*1.12+k*r*.18); ctx.stroke();
  // body
  ctx.save(); ctx.translate(x,y); ctx.rotate(wob);
  const g=ctx.createRadialGradient(-r*.35,-r*.45,r*.1,0,0,r*1.15);
  g.addColorStop(0,"#ffffff"); g.addColorStop(.18,b.color); g.addColorStop(1,shade(b.color,-.25));
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,r,r*1.12,0,0,Math.PI*2); ctx.fill();
  // knot
  ctx.fillStyle=shade(b.color,-.2); ctx.beginPath(); ctx.moveTo(-r*.1,r*1.1); ctx.lineTo(r*.1,r*1.1); ctx.lineTo(0,r*1.2); ctx.closePath(); ctx.fill();
  // shine
  ctx.fillStyle="rgba(255,255,255,.55)"; ctx.beginPath(); ctx.ellipse(-r*.42,-r*.5,r*.14,r*.24,-.5,0,Math.PI*2); ctx.fill();
  // cute picture in a white window
  ctx.fillStyle="rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(0,r*.05,r*.62,0,Math.PI*2); ctx.fill();
  ctx.font=Math.round(r*.85)+"px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(b.pic,0,r*.1);
  ctx.restore();
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(v+(amt<0?v*amt:(255-v)*amt))));
  return "rgb("+f(r)+","+f(g)+","+f(b)+")";
}
function draw(){
  const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#6cc1ff"); sky.addColorStop(1,"#d9f1ff");
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // sun
  const m=Math.min(W,H);
  ctx.fillStyle="#ffe36b"; ctx.beginPath(); ctx.arc(W-m*.16,m*.16,m*.08,0,Math.PI*2); ctx.fill();
  // clouds
  ctx.fillStyle="rgba(255,255,255,.9)";
  for(const c of clouds){ const cx=c.x*W, cy=c.y*H, s=m*.06*c.s;
    ctx.beginPath(); ctx.arc(cx,cy,s,0,7); ctx.arc(cx+s,cy-s*.4,s*1.2,0,7); ctx.arc(cx+s*2.2,cy,s,0,7); ctx.fill(); }
  // grass
  ctx.fillStyle="#7fd36b"; ctx.beginPath(); ctx.ellipse(W*.25,H+m*.05,W*.45,m*.13,0,0,7); ctx.ellipse(W*.8,H+m*.06,W*.4,m*.12,0,0,7); ctx.fill();

  for(const b of balloons) drawBalloon(b);
  for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.life); ctx.font=Math.round(f.size)+"px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(f.pic,f.x,f.y); ctx.globalAlpha=1; }
  for(const p of bits){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.min(1,p.life*2); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); ctx.restore(); }
  ctx.globalAlpha=1;

  if(G.mode==="play"||G.mode==="cheer"){
    // progress: a row of bubbles that fill with the pictures she popped (no reading needed)
    const need=LEVELS[G.level].need, size=Math.min(40,(W-140)/need), y=H-size*.9-8;
    const x0=W/2-(need*size)/2+size/2;
    for(let i=0;i<need;i++){
      ctx.fillStyle=i<G.popped?"rgba(255,255,255,.95)":"rgba(255,255,255,.4)";
      ctx.beginPath(); ctx.arc(x0+i*size,y,size*.42,0,7); ctx.fill();
      if(trophies[i]){ ctx.font=Math.round(size*.55)+"px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(trophies[i],x0+i*size,y+1); }
    }
    // level stars at the top
    for(let i=0;i<3;i++){ ctx.font=Math.round(Math.min(40,m*.07))+"px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif";
      ctx.globalAlpha=i<=G.level?1:.3; ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillText("⭐",W/2+(i-1)*Math.min(52,m*.09),14); }
    ctx.globalAlpha=1;
  }
  if(G.mode==="cheer"){
    const s=1+Math.sin(G.cheer*6)*.06;
    ctx.save(); ctx.translate(W/2,H*.45); ctx.scale(s,s);
    ctx.font="800 "+Math.round(m*.16)+"px \"Baloo 2\",\"Comic Sans MS\",sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="#ff5fa2"; ctx.fillText("Yay!",0,6); ctx.fillStyle="#fff"; ctx.fillText("Yay!",0,0);
    ctx.font=Math.round(m*.12)+"px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif"; ctx.fillText(G.level===2?"🏆":"⭐",0,m*.17);
    ctx.restore();
  }
  if(G.mode==="title"||G.mode==="end"){
    // a few decorative balloons drift on the title screen
    for(const b of balloons) drawBalloon(b);
  }
}

// title screen: gentle balloons in the background
function titleBalloons(dt){
  if(G.mode!=="title"&&G.mode!=="end") return;
  if(balloons.length<4&&Math.random()<dt*1.2){ const keep=G.level; G.level=0; newBalloon(); G.level=keep; }
}

let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000)); last=now;
  titleBalloons(dt); update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener("visibilitychange",()=>{ last=performance.now(); });

window.__bp={G,get balloons(){return balloons},hit,startLevel,LEVELS};
})();
</script>
