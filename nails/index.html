<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Glow Nail Salon</title>
<!-- PLAY COUNTER: GoatCounter site zayngames -->
<script data-goatcounter="https://zayngames.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Baloo+2:wght@700;800&display=swap">
<style>
:root{--pink:#ff4fa3;--plum:#4a2a5e;--skin:#c68642}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;color:var(--plum);background:linear-gradient(#ffd6ec,#e3d4ff)}
button{font-family:inherit;color:inherit}
#app{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:6px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:8px}
#stickers{font-size:26px;white-space:nowrap;overflow:hidden;background:#fff9;border-radius:99px;padding:0 14px;min-height:40px;display:flex;align-items:center;gap:2px}
#stickers b{font-size:18px;margin-right:6px}
#grown{border:0;background:#fff7;border-radius:99px;padding:6px 14px;font-size:14px;cursor:pointer}
.stage{display:flex;align-items:center;gap:12px;height:24%;min-height:100px}
#cust{height:100%;aspect-ratio:1;flex:none;transition:transform .5s}
#cust.in{animation:slide .6s ease-out} #cust.happy{animation:hop .5s 4}
#bubble{flex:1;height:82%;background:#fff;border:4px solid #ffb3d9;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:18px;
  font-size:clamp(34px,9vh,72px);cursor:pointer;line-height:1;position:relative}
#bubble::before{content:"";position:absolute;left:-18px;top:50%;margin-top:-12px;border:12px solid transparent;border-right-color:#ffb3d9;border-left:0}
#bubble .num{font-family:Andika,sans-serif;font-size:1.4em;color:var(--pink)}
#bubble .dots{display:grid;grid-template-columns:repeat(3,auto);gap:6px}
#bubble .dots i{width:.32em;height:.32em;border-radius:50%;background:var(--plum);display:block}
#bubble .spk{animation:pulse 1.2s infinite}
.hand{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;gap:1.5%;padding:0 3%}
.finger{flex:1;max-width:150px;border-radius:999px 999px 0 0;background:var(--skin);position:relative;box-shadow:inset -10px 0 0 #0001}
.nail{position:absolute;left:14%;top:7%;width:72%;height:min(62%,150px);border-radius:46% 46% 24% 24%;background:#ffeef3;border:3px solid #0002;overflow:hidden;cursor:pointer;display:grid;place-items:center}
.nail .paint{position:absolute;inset:auto 0 0 0;height:0;background:var(--c,#f9c);transition:height .6s ease-out}
.nail.painted .paint{height:100%}
.nail .shine{position:absolute;top:8%;left:14%;width:16%;height:38%;border-radius:99px;background:#fff8;z-index:1}
.nail .stamp{position:relative;z-index:2;font-size:clamp(22px,5.5vh,46px);transition:transform .3s}
.nail .stamp.pop{animation:pop .4s}
.nail .gem{position:absolute;bottom:3%;z-index:3;font-size:clamp(18px,4vh,32px)}
.nail .gem.hi{animation:pop .5s}
.nail.active{outline:5px dashed var(--pink);outline-offset:4px;animation:pulse 1s infinite}
.tray{height:25%;min-height:118px;background:#fffa;border-radius:28px 28px 0 0;display:flex;align-items:center;justify-content:center;gap:4%;padding:8px 8px max(8px,env(safe-area-inset-bottom,0px))}
.bottle{height:94%;aspect-ratio:3/5;position:relative;border:0;background:none;padding:0;cursor:pointer;transition:transform .2s}
.bottle .cap{position:absolute;left:30%;top:0;width:40%;height:30%;background:#3b2a4a;border-radius:8px 8px 2px 2px}
.bottle .body{position:absolute;left:0;bottom:0;width:100%;height:72%;background:var(--c);border-radius:26% 26% 18% 18%;box-shadow:inset -10px -8px 0 #0002,inset 8px 6px 0 #fff3}
.bottle .lab{position:absolute;left:14%;bottom:12%;width:72%;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-family:Andika,sans-serif;font-weight:700;font-size:clamp(34px,9vh,70px);line-height:1;color:var(--plum);padding-bottom:.12em}
.bottle.shake{animation:shake .4s} .bottle.glow{animation:glow 1s infinite} .bottle.pick{transform:translateY(-14%) rotate(-8deg)}
.big{height:82%;aspect-ratio:1;border-radius:50%;border:0;font-size:clamp(34px,9vh,70px);cursor:pointer;box-shadow:0 6px 0 #0002;background:#fff;line-height:1}
.big:active,.bottle:active{transform:scale(.94)}
.big.go{background:#34d27b;color:#fff} .big.heart{background:var(--pink)} .big.sel{outline:6px solid var(--pink);outline-offset:3px}
.small{height:64%}
.ov{position:fixed;inset:0;background:linear-gradient(#ffd6ecf5,#e3d4fff5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:20;text-align:center;padding:20px}
.ov h1{font-size:clamp(34px,8vw,64px);margin:0;line-height:1.05}
.ov .play{width:min(40vw,40vh);aspect-ratio:1;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:min(18vw,18vh);cursor:pointer;box-shadow:0 10px 0 #c2307a;animation:pulse 1.4s infinite}
.ov .row{font-size:38px;max-width:90vw;line-height:1.3}
.ov .txt{border:0;background:#fff;border-radius:99px;padding:10px 22px;font-size:18px;cursor:pointer}
.ov table{border-collapse:collapse;font-size:18px;background:#fff;border-radius:16px;overflow:hidden}
.ov td,.ov th{padding:6px 16px;border-bottom:1px solid #eee} .ov td:first-child{font-family:Andika,sans-serif;font-size:26px}
.ov p{margin:0;max-width:46ch;font-family:system-ui,sans-serif;font-size:15px}
#prize{font-size:min(40vw,40vh);animation:pop .6s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15}
#flash.on{animation:flash .5s}
.conf{position:fixed;top:-5vh;font-size:28px;z-index:16;pointer-events:none;animation:fall linear forwards}
[hidden]{display:none!important}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-8px) rotate(-5deg)}75%{transform:translateX(8px) rotate(5deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 14px #ffd400) brightness(1.15);transform:translateY(-6%)}}
@keyframes slide{from{transform:translateX(-140%)}}
@keyframes hop{50%{transform:translateY(-12%)}}
@keyframes flash{30%{opacity:.9}}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div id="stickers" aria-label="Sticker collection"></div><button id="grown" type="button">Grown-ups</button></div>
  <div class="stage"><div id="cust"></div><div id="bubble" role="button" aria-label="Hear it again"></div></div>
  <div class="hand" id="hand"></div>
  <div class="tray" id="tray"></div>
</div>
<div id="flash"></div>
<div class="ov" id="title"><h1>Glow Nail Salon</h1><button class="play" id="start" type="button" aria-label="Play">▶</button></div>
<div class="ov" id="prizeOv" hidden><div id="prize"></div></div>
<div class="ov" id="closeOv" hidden><h1>🌙 Salon closed!</h1><div class="row" id="closeRow"></div><button class="txt" id="more" type="button">Open again</button></div>
<div class="ov" id="grownOv" hidden>
  <h1 style="font-size:30px">For grown-ups</h1>
  <p>She hears a letter sound and picks the matching polish, counts out gems, then decorates freely. New letters (p, i, n) unlock as she gets the current ones right first try. The salon closes after 4 customers, about 10 to 15 minutes.</p>
  <table id="stats"></table>
  <div style="display:flex;gap:10px"><button class="txt" id="reset" type="button">Reset progress</button><button class="txt" id="closeG" type="button">Back to game</button></div>
</div>

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const LET={s:{c:"#ff4fa3",w:[["sun","☀️"],["sock","🧦"],["snake","🐍"]]},a:{c:"#ff5a4d",w:[["ant","🐜"],["apple","🍎"]]},t:{c:"#12b5a6",w:[["tent","⛺"],["tap","🚰"]]},
 p:{c:"#8b5cf6",w:[["pig","🐷"],["pan","🍳"],["pen","🖊️"]]},i:{c:"#3b82f6",w:[["insect","🐛"]]},n:{c:"#ff9a1f",w:[["net","🥅"],["nap","😴"]]}};
const ORDER=["s","a","t","p","i","n"], STK=["⭐","💖","🌈","🦋","🌸"], PRIZES=["🦄","🐱","🐶","🍭","🎀","👑","🧁","🌟","🐞","🎈","🍓","🐰","🦋","🌈","💎","🎤"];
const CUSTS=[{skin:"#8d5a3b",hair:"#2b1a12",style:"buns",bow:"#ff4fa3"},{skin:"#c68642",hair:"#5b3fc4",style:"long",bow:"#ffd400"},{skin:"#f1c27d",hair:"#ff7ac8",style:"puffs",bow:"#12b5a6"},
 {skin:"#6b4226",hair:"#1b1b3a",style:"long",bow:"#ff4fa3"},{skin:"#e0ac69",hair:"#19b8c2",style:"buns",bow:"#8b5cf6"}];

let S={served:0,stickers:[],stats:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("glowNails")||"{}"))}catch(e){}
for(const l of ORDER)S.stats[l]=S.stats[l]||{seen:0,first:0};
const save=()=>{try{localStorage.setItem("glowNails",JSON.stringify(S))}catch(e){}};
function track(n){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:n,title:n,event:true})}catch(e){}}

/* ---------- sound ---------- */
let ctx,buf={},cur=null,sayId=0,lastAct=Date.now(),speaking=0;
async function loadAudio(){
  ctx=new (window.AudioContext||window.webkitAudioContext)(); try{await ctx.resume()}catch(e){}
  await Promise.all(Object.keys(A).map(async k=>{try{const b=Uint8Array.from(atob(A[k]),c=>c.charCodeAt(0)).buffer;buf[k]=await new Promise((res,rej)=>ctx.decodeAudioData(b,res,rej))}catch(e){}}));
}
function stop(){sayId++;if(cur){try{cur.onended=null;cur.stop()}catch(e){}cur=null}}
function play1(k){return new Promise(res=>{const b=buf[k];if(!b)return setTimeout(res,250);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);cur=s;
  let d=false;const fin=()=>{if(!d){d=true;res()}};s.onended=fin;setTimeout(fin,b.duration*1000+400);s.start()})}
async function say(...ks){stop();const id=sayId;speaking++;try{for(const k of ks){if(id!==sayId)return false;await play1(k);await sleep(110)}}finally{speaking--;lastAct=Date.now()}return id===sayId}
function tone(f,t=0,d=.15,type="sine",g=.14){if(!ctx)return;const o=ctx.createOscillator(),v=ctx.createGain(),T=ctx.currentTime+t;o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,T);v.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(v).connect(ctx.destination);o.start(T);o.stop(T+d)}
const sfx={ding(){[880,1320].forEach((f,i)=>tone(f,i*.09))},pop(){tone(520,0,.08,"triangle")},nope(){tone(280,0,.14,"triangle",.07)},
 sparkle(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,i*.07,.2))},fanfare(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.3,"triangle"))}};

/* ---------- taps ---------- */
let tapRes=null,prompt=null;
const waitTap=()=>new Promise(r=>tapRes=r);
function tap(v){lastAct=Date.now();if(tapRes){const r=tapRes;tapRes=null;r(v)}}
$("#bubble").onclick=()=>{lastAct=Date.now();prompt&&prompt()};
setInterval(()=>{if(prompt&&!speaking&&Date.now()-lastAct>9000){lastAct=Date.now();prompt()}},1000);
document.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- drawing ---------- */
function avatar(c){const h=c.hair,extra=c.style==="buns"?`<circle cx="22" cy="24" r="14" fill="${h}"/><circle cx="78" cy="24" r="14" fill="${h}"/>`:
  c.style==="puffs"?`<circle cx="14" cy="50" r="15" fill="${h}"/><circle cx="86" cy="50" r="15" fill="${h}"/>`:`<rect x="12" y="46" width="76" height="52" rx="20" fill="${h}"/>`;
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">${extra}<circle cx="50" cy="48" r="38" fill="${h}"/><circle cx="50" cy="58" r="29" fill="${c.skin}"/>
  <path d="M21 52 Q50 22 79 52 Q60 40 50 41 Q40 40 21 52Z" fill="${h}"/><circle cx="39" cy="57" r="4" fill="#2a1a2e"/><circle cx="61" cy="57" r="4" fill="#2a1a2e"/><circle cx="40.5" cy="55.5" r="1.3" fill="#fff"/><circle cx="62.5" cy="55.5" r="1.3" fill="#fff"/>
  <circle cx="31" cy="66" r="5" fill="#ff7aa8" opacity=".45"/><circle cx="69" cy="66" r="5" fill="#ff7aa8" opacity=".45"/><path d="M40 68 Q50 78 60 68" stroke="#2a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M50 16 L36 8 L36 24Z M50 16 L64 8 L64 24Z" fill="${c.bow}"/><circle cx="50" cy="16" r="4" fill="${c.bow}"/></svg>`}
let nails=[];
function drawHand(c){const H=[70,88,100,90,62];document.documentElement.style.setProperty("--skin",c.skin);const hand=$("#hand");hand.innerHTML="";nails=[];
  H.forEach((h,i)=>{const f=document.createElement("div");f.className="finger";f.style.height=h+"%";
    f.innerHTML=`<div class="nail"><div class="paint"></div><div class="shine"></div><span class="stamp"></span><span class="gem"></span></div>`;
    const n=f.firstChild;n.onclick=()=>tap({t:"nail",i});hand.append(f);nails.push({el:n,stamp:n.querySelector(".stamp"),gem:n.querySelector(".gem")})})}
function stickersBar(){$("#stickers").innerHTML=`<b>${S.stickers.length}</b>`+S.stickers.slice(-10).join("")}
function bubble(html){$("#bubble").innerHTML=html}
function btn(cls,txt,val,label){const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=txt;b.setAttribute("aria-label",label||txt);b.onclick=()=>tap(val);return b}
function confetti(){for(let i=0;i<26;i++){const s=document.createElement("span");s.className="conf";s.textContent=pick(["✨","💖","⭐","🎉","💜"]);s.style.left=rnd(100)+"vw";s.style.animationDuration=(1.6+Math.random()*1.6)+"s";document.body.append(s);setTimeout(()=>s.remove(),3400)}}

/* ---------- letters ---------- */
function pool(){const p=["s","a","t"];for(const l of ["p","i","n"]){if(p.every(x=>S.stats[x].first>=3&&S.stats[x].first/S.stats[x].seen>=.7))p.push(l);else break}return p}
let lastT=null;const G={target:null,N:0,phase:""};window.G=G;
function pickTarget(){const p=pool().filter(l=>l!==lastT);p.sort((a,b)=>S.stats[a].seen-S.stats[b].seen||Math.random()-.5);return lastT=(Math.random()<.6?p[0]:pick(p))}

/* ---------- rounds ---------- */
let hints=0;
async function polish(i){
  const t=pickTarget(),others=shuffle(pool().filter(l=>l!==t)).slice(0,2);G.target=t;G.phase="polish";
  const tray=$("#tray");tray.innerHTML="";const els={};
  shuffle([t,...others]).forEach(l=>{const b=btn("bottle","",{t:"bottle",l},"polish "+l);b.style.setProperty("--c",LET[l].c);b.innerHTML=`<span class="cap"></span><span class="body"></span><span class="lab">${l}</span>`;els[l]=b;tray.append(b)});
  nails[i].el.classList.add("active");bubble(`<span class="spk">🔊</span>`);
  prompt=()=>say("find","snd_"+t);prompt();
  let wrong=0;
  for(;;){const x=await waitTap();if(x.t!=="bottle")continue;
    if(x.l===t)break;
    wrong++;sfx.nope();els[x.l].classList.remove("shake");void els[x.l].offsetWidth;els[x.l].classList.add("shake");
    if(wrong>=2)els[t].classList.add("glow");
    say("says","snd_"+x.l,"find","snd_"+t)}
  S.stats[t].seen++;if(!wrong)S.stats[t].first++;save();
  sfx.ding();els[t].classList.remove("glow");els[t].classList.add("pick");
  prompt=()=>say("tapnail");if(hints++<3)prompt();else say("snd_"+t);
  for(;;){const x=await waitTap();if(x.t==="nail"&&x.i===i)break}
  prompt=null;const n=nails[i],[w,e]=pick(LET[t].w);n.el.classList.remove("active");n.el.style.setProperty("--c",LET[t].c);n.el.classList.add("painted");sfx.sparkle();
  await sleep(450);n.stamp.textContent=e;n.stamp.classList.add("pop");bubble(`<span>${e}</span>`);
  await say("snd_"+t,"snd_"+t,"w_"+w);
}
async function gems(){
  const N=1+rnd(S.served<2?3:5);G.N=N;G.phase="gems";
  bubble(`<span class="num">${N}</span><span class="dots">${"<i></i>".repeat(N)}</span>`);
  const tray=$("#tray");tray.innerHTML="";tray.append(btn("big","💎",{t:"gem"},"Add a gem"),btn("big go","✔",{t:"tick"},"Done"));
  prompt=()=>say("gems"+N);prompt();let placed=[];
  for(;;){const x=await waitTap();
    if(x.t==="gem"){const f=[0,1,2,3,4].find(i=>!placed.includes(i));if(f==null){sfx.nope();continue}
      placed.push(f);nails[f].gem.textContent="💎";nails[f].gem.classList.remove("hi");void nails[f].gem.offsetWidth;nails[f].gem.classList.add("hi");sfx.pop();say("n"+placed.length)}
    else if(x.t==="nail"&&placed.includes(x.i)){placed=placed.filter(i=>i!==x.i);nails[x.i].gem.textContent="";sfx.pop()}
    else if(x.t==="tick"){if(!placed.length){prompt();continue}
      if(placed.length===N)break;
      const p=prompt;prompt=null;await say("count");placed.sort((a,b)=>a-b);
      for(let k=0;k<placed.length;k++){const g=nails[placed[k]].gem;g.classList.remove("hi");void g.offsetWidth;g.classList.add("hi");await say("n"+(k+1))}
      await say("asked","n"+N,"again");placed.forEach(i=>nails[i].gem.textContent="");placed=[];prompt=p;prompt()}}
  prompt=null;sfx.ding();await say(pick(["cheer_yes","cheer_listening"]));
}
async function freeplay(){
  G.phase="free";bubble("<span>🎨</span>");const tray=$("#tray");tray.innerHTML="";let sel=STK[0];const bs={};
  STK.forEach(s=>{bs[s]=btn("big small",s,{t:"stk",v:s},"sticker");tray.append(bs[s])});bs[sel].classList.add("sel");
  tray.append(btn("big heart","💗",{t:"heart"},"All done"));
  prompt=()=>say("free");prompt();
  for(;;){const x=await waitTap();
    if(x.t==="stk"){bs[sel].classList.remove("sel");sel=x.v;bs[sel].classList.add("sel");sfx.pop()}
    else if(x.t==="nail"){const s=nails[x.i].stamp;s.textContent=sel;s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");sfx.sparkle()}
    else if(x.t==="heart")break}
  prompt=null;
}
async function finale(){
  G.phase="finale";$("#tray").innerHTML="";const fl=$("#flash");fl.classList.remove("on");void fl.offsetWidth;fl.classList.add("on");confetti();sfx.fanfare();
  bubble("<span>😍</span>");const c=$("#cust");c.classList.remove("in","happy");void c.offsetWidth;c.classList.add("happy");
  await say(pick(["love1","love2","love3"]));
  S.served++;const st=pick(PRIZES);S.stickers.push(st);save();track("nails-customer");
  $("#prize").textContent=st;$("#prizeOv").hidden=false;sfx.sparkle();
  await say(pick(["cheer_superstar","cheer_team","cheer_yes"]),"cheer_sticker");
  $("#prizeOv").hidden=true;stickersBar();
}
let ci=rnd(CUSTS.length);
async function customer(first){
  const c=CUSTS[ci++%CUSTS.length];$("#cust").innerHTML=avatar(c);$("#cust").classList.remove("in","happy");void $("#cust").offsetWidth;$("#cust").classList.add("in");
  drawHand(c);$("#tray").innerHTML="";bubble("<span>👋</span>");prompt=null;
  if(!first)await say("next");
  await say(pick(["hello1","hello2","hello3"]));
  for(let i=0;i<5;i++)await polish(i);
  await gems();await freeplay();await finale();
}
async function run(){
  for(let n=1;;n++){await customer(n===1);
    if(n%4===0){$("#closeRow").textContent=S.stickers.slice(-24).join(" ");$("#closeOv").hidden=false;confetti();say("cheer_bye");
      for(;;){const x=await waitTap();if(x.t==="more")break}$("#closeOv").hidden=true}}
}

/* ---------- boot ---------- */
stickersBar();
$("#more").onclick=()=>tap({t:"more"});
$("#start").onclick=async()=>{const b=$("#start");b.disabled=true;b.textContent="…";await loadAudio();$("#title").hidden=true;track("nails-start");
  $("#cust").innerHTML=avatar(CUSTS[ci%CUSTS.length]);await say("cheer_hi");run()};
$("#grown").onclick=()=>{$("#stats").innerHTML="<tr><th>Sound</th><th>Asked</th><th>Right first try</th></tr>"+ORDER.map(l=>`<tr><td>${l}</td><td>${S.stats[l].seen}</td><td>${S.stats[l].first}</td></tr>`).join("")+
  `<tr><th colspan="2">Customers served</th><th>${S.served}</th></tr>`;$("#reset").textContent="Reset progress";$("#grownOv").hidden=false};
$("#closeG").onclick=()=>$("#grownOv").hidden=true;
$("#reset").onclick=e=>{if(e.target.textContent!=="Tap again to reset"){e.target.textContent="Tap again to reset";return}
  S={served:0,stickers:[],stats:{}};for(const l of ORDER)S.stats[l]={seen:0,first:0};save();stickersBar();$("#grownOv").hidden=true};
</script>
</body>
</html>
